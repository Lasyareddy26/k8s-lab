name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app:1.0 .

      - name: Run container
        run: docker run -d -p 8080:8080 --name test-app my-app:1.0

      - name: Test the app
        run: |
          sleep 5
          curl --fail http://localhost:8080

      - name: Show container logs
        if: always()
        run: docker logs test-app
